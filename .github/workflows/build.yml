name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Release/net9.0/Jellyfin.Plugin.CustomTheme.dll meta.json dist/
          (cd dist && zip -q -X plugin.zip Jellyfin.Plugin.CustomTheme.dll meta.json)
          echo "MD5: $(md5sum dist/plugin.zip | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/plugin.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build & package release zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet build -c Release --nologo
          mkdir -p dist
          cp bin/Release/net9.0/Jellyfin.Plugin.CustomTheme.dll meta.json dist/
          (cd dist && zip -q -X "custom-theme-v${VERSION}.zip" Jellyfin.Plugin.CustomTheme.dll meta.json)
          MD5="$(md5sum "dist/custom-theme-v${VERSION}.zip" | cut -d' ' -f1)"
          echo "MD5=$MD5" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### Plugin checksum" >> "$GITHUB_STEP_SUMMARY"
          echo "MD5 \`$MD5\` — copy this into manifest.json for v${VERSION}." >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/custom-theme-v${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes "Automated release. Plugin zip MD5: \`${MD5}\` (must match the checksum in manifest.json)."
