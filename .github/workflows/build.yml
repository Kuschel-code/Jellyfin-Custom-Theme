name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build -c Release --nologo

      - name: Package
        run: |
          mkdir -p dist
          cp bin/Release/net9.0/Jellyfin.Plugin.CustomTheme.dll meta.json dist/
          (cd dist && zip -q -X plugin.zip Jellyfin.Plugin.CustomTheme.dll meta.json)
          echo "MD5: $(md5sum dist/plugin.zip | cut -d' ' -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/plugin.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build, package & publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="custom-theme-v${VERSION}.zip"
          dotnet build -c Release --nologo
          mkdir -p dist
          cp bin/Release/net9.0/Jellyfin.Plugin.CustomTheme.dll meta.json dist/
          (cd dist && zip -q -X "$ZIP" Jellyfin.Plugin.CustomTheme.dll meta.json)
          MD5="$(md5sum "dist/$ZIP" | cut -d' ' -f1)"
          echo "### Plugin checksum" >> "$GITHUB_STEP_SUMMARY"
          echo "MD5 \`$MD5\` for $ZIP" >> "$GITHUB_STEP_SUMMARY"

          # Idempotent: create the release if it doesn't exist yet, then
          # (re-)upload the asset. Re-running a tag or a pre-created release
          # no longer fails the job and always ends with the zip attached.
          gh release create "$GITHUB_REF_NAME" \
            --title "v${VERSION}" \
            --notes "Automated release. Plugin zip MD5: \`${MD5}\`." \
            || echo "Release $GITHUB_REF_NAME already exists; uploading asset to it."
          gh release upload "$GITHUB_REF_NAME" "dist/$ZIP" --clobber

      - name: Pin checksum into manifest.json
        env:
          VERSION_REF: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION_REF#v}"
          MD5="$(md5sum "dist/custom-theme-v${VERSION}.zip" | cut -d' ' -f1)"
          python3 - "$VERSION" "$MD5" <<'PY'
          import json, sys
          version, md5 = sys.argv[1], sys.argv[2]
          data = json.load(open('manifest.json'))
          for pkg in data:
              for ver in pkg.get('versions', []):
                  if ver.get('version') in (version, version + '.0'):
                      ver['checksum'] = md5
          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          if ! git diff --quiet manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Pin manifest checksum for ${VERSION_REF}"
            git push origin HEAD:main || echo "::warning::Could not push manifest update (branch protection?). Copy the MD5 from the job summary into manifest.json manually."
          fi
